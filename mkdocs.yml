site_name: Alberto Research
site_description: >-
  Documentação do alberto-research: automação de pesquisa científica com
  descoberta, resolução de DOI, leitura de texto completo, triagem por LLM,
  síntese e digests diários.
site_url: https://gabriel-affonso.github.io/alberto-research/
repo_url: https://github.com/gabriel-affonso/alberto-research
repo_name: gabriel-affonso/alberto-research
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Instalação: installation.md
  - Configuração: configuration.md
  - Uso: usage.md
  - Arquitetura: architecture.md
  - Integrações: integrations.md
  - Perguntas frequentes: faq.md
  - Solução de problemas: troubleshooting.md
  - Reprodutibilidade: reproducibility.md
  - Segurança: security.md
  - Referência da API: api.md
