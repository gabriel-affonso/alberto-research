name: OpenSSF Scorecard

on:
  schedule:
    # Weekly, Mondays at 01:30 UTC.
    - cron: "30 1 * * 1"
  # Re-run when branch protection changes; that is a scored signal.
  branch_protection_rule:
  push:
    branches:
      - main

# Read-only by default; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Upstream breakage, not a problem with this repository:
    # ossf/scorecard-action@v2.4.0 is distributed via gcr.io, and pulling it now
    # fails with "This API method requires billing to be enabled" (the OpenSSF
    # project's GCR registry rejected anonymous pulls). Every run therefore dies
    # while fetching the action image, before any analysis happens. Keeping the
    # job but not letting it fail the workflow avoids training reviewers to
    # ignore a permanently red check. Remove this once ossf/scorecard-action
    # ships from a registry that does not require billing (e.g. ghcr.io).
    continue-on-error: true
    permissions:
      # upload-sarif needs security-events; publish_results needs id-token.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Scorecard inspects history and branch structure.
          fetch-depth: 0
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the public OpenSSF API (public repos only).
          publish_results: true

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
