name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Needed to post the dependency summary as a PR comment.
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fails the PR when a newly introduced/updated dependency carries a
      # known vulnerability of high severity or worse.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
