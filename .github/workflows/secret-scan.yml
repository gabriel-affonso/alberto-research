name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily full-history sweep: catches secrets that landed before the
    # push-time scanners existed.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          # --log-opts="--all" walks every commit, so a shallow clone is useless.
          fetch-depth: 0
          persist-credentials: false

      # Independent gate: the action bundles the gitleaks binary and scans
      # the push/PR commit range, failing the job on any leak.
      - name: Run gitleaks action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicit full-history sweep. Non-zero exit on any leak fails the job.
      - name: Scan all commits for secrets
        run: gitleaks detect --source . --log-opts="--all" --redacted --verbose

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # --only-verified means a non-zero exit is a live credential, not a
      # pattern match; --fail makes that exit fail the job.
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
