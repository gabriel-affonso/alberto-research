name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily full-history sweep: catches secrets that landed before the
    # push-time scanners existed.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # --log-opts="--all" walks every commit, so a shallow clone is useless.
          fetch-depth: 0
          persist-credentials: false

      # Independent gate: the action bundles the gitleaks binary and scans
      # the push/PR commit range, failing the job on any leak.
      - name: Run gitleaks action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicit full-history sweep. Non-zero exit on any leak fails the job.
      - name: Scan all commits for secrets
        run: gitleaks detect --source . --log-opts="--all" --redact --verbose

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action already passes `--fail`, so it must NOT be repeated here:
      # trufflehog rejects a repeated flag with
      # "flag 'fail' cannot be repeated". `--only-verified` keeps the check to
      # credentials proven live, so a failure means a real leaked credential
      # rather than a pattern match.
      #
      # No `base`/`head` range is passed on purpose. Passing the default branch
      # as `base` makes it equal to `head` on the first push to a new remote
      # (and on any push where the branch IS the default), and trufflehog then
      # aborts with "BASE and HEAD commits are the same. TruffleHog won't scan
      # anything." A full-history scan is both correct and stricter.
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
